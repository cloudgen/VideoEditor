[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "VideoEditor"
version = "1.0.0"
description = "VideoEditor joins two local videos and cuts, speeds, or boomerangs an MP4, using FFmpeg."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Wilgat Wong", email = "wilgat.wong@gmail.com"}
]
keywords = ["Video Editing", "Video", "Multimedia"]

dependencies = [
    "opencv-python-headless>=5.0.0.93",
    "ChronicleLogger>=1.3.1",
]

# Official project links (this is what shows on PyPI!)
[project.urls]
Homepage = "https://github.com/cloudgen/VideoEditor"
Repository = "https://github.com/cloudgen/VideoEditor"
Issues = "https://github.com/cloudgen/VideoEditor/issues"

# video-editor is the combined console script. video-join and video-speed
# call the same entry so both inherited verbs stay reachable.
[project.scripts]
video-editor = "VideoEditor.cli:main"
video-join = "VideoEditor.cli:main"
video-speed = "VideoEditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]